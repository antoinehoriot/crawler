name: Daily crawl
on:
  schedule:
    - cron: '0 4 * * *'   # 06:00 Europe/Paris in summer (UTC-only cron; 05:00 in winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run go
      - name: Commit snapshots and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.db reports
          git diff --cached --quiet || git commit -m "chore: daily crawl $(date -u +%F)"
          git push
