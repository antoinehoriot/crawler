name: Daily crawl
on:
  schedule:
    - cron: '23 4 * * *'  # ~06:23 Europe/Paris in summer (UTC-only cron; ~05:23 in winter). Off-peak minute: GitHub drops/delays top-of-hour schedules.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crawl
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run go
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      - name: Commit snapshots and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.db reports
          git diff --cached --quiet || git commit -m "chore: daily crawl $(date -u +%F)"
          git pull --rebase
          git push
      - name: Notify ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "no NTFY_TOPIC secret; skipping"; exit 0; }
          today=$(date -u +%F)
          report="reports/$today.md"
          if [ "${{ job.status }}" = "success" ] && [ -f "$report" ]; then
            top=$(awk -F'|' '$2 ~ /^ *[0-9]+ *$/ { gsub(/^ +| +$/, "", $3); print "- " $3 }' "$report" | head -5)
            curl -s \
              -H "Title: Trend digest $today" \
              -H "Click: https://github.com/${{ github.repository }}/blob/main/$report" \
              -d "$top" \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          else
            curl -s \
              -H "Title: Trend crawl FAILED $today" \
              -H "Priority: high" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "Check the run logs." \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
